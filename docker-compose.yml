services:
  swayrouter:
    image: envielxyz/swayrouter:latest
    container_name: swayrouter
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    # Sized for the private gateway burst profile (roughly 100 RPS at the
    # Router boundary). The application also reads cgroup memory and backs
    # admission down before this hard limit is reached.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: "2.0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:14045:14045"
    volumes:
      - ${SWAY_DATA_VOLUME:-swayrouter-data}:/app/data

    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:14045/api/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    environment:
      DATA_DIR: /app/data
      PORT: "14045"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-}
      API_KEY_SECRET: ${API_KEY_SECRET:-}
      MACHINE_ID_SALT: ${MACHINE_ID_SALT:-}
    networks:
      - internal

volumes:
  swayrouter-data:
    name: ${SWAY_DATA_VOLUME:-swayrouter-data}

networks:
  internal:
    # The router must reach upstream providers and OAuth endpoints. Keep the
    # service bound to localhost above, but use a normal bridge network for
    # outbound egress from the container.
    driver: bridge
    internal: false
