name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --output "$archive" "$base/$archive"
          curl --fail --silent --show-error --location --output checksums.txt "$base/gitleaks_${version}_checksums.txt"
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks

      - name: Scan Git history
        run: ./gitleaks git . --redact --verbose

  server:
    name: Server (typecheck + test + syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres is the only database driver and Valkey backs the cache/lock
    # layer; both must be up before `bun test` (advisory: no sqlite fallback
    # left in the suite).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: suwok
          POSTGRES_PASSWORD: suwok
          POSTGRES_DB: suwokrouter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated route table
        run: bun run routes:check

      - name: Run tests
        run: bun test
        env:
          DB_URL: postgres://suwok:suwok@127.0.0.1:5432/suwokrouter_test
          REDIS_URL: redis://127.0.0.1:6379

      - name: Run CLI tests
        run: bun test ./cli/cli.test.js ./cli/src/runtime/discover.test.js ./cli/src/runtime/lifecycle.test.js ./cli/src/runtime/runMenu.test.js ./cli/src/runtime/update.test.js

      - name: Syntax check
        run: bun scripts/syntaxcheck.js

  binary:
    name: Compiled binary smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
          - os: windows-latest
            target: bun-windows-x64
          - os: macos-15-intel
            target: bun-darwin-x64
          - os: macos-14
            target: bun-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install server deps
        run: bun install --frozen-lockfile
      - name: Install dashboard deps
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Build compiled package
        env:
          BUN_TARGET: ${{ matrix.target }}
        run: bun run build:binary
      - name: Smoke compiled package
        env:
          BUN_TARGET: ${{ matrix.target }}
        run: bun run smoke:binary
      - name: Upload binary package
        uses: actions/upload-artifact@v4
        with:
          name: suwokrouter-${{ matrix.target }}
          path: dist-binary

  dashboard:
    name: Dashboard (Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-dashboard-${{ runner.os }}-${{ hashFiles('dashboard/bun.lock') }}
          restore-keys: |
            bun-dashboard-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bunx vite build

  package:
    name: npm package contents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install server deps
        run: bun install --frozen-lockfile

      - name: Install dashboard deps
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run build:dashboard

      - name: Inspect npm package
        run: bun run package:check

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install server deps
        run: bun install --frozen-lockfile

      - name: Install dashboard deps
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e

  docker-smoke:
    name: Docker image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag suwokrouter:ci .

      - name: Run zero-config container smoke test
        shell: bash
        run: |
          set -euo pipefail
          container="suwokrouter-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="suwokrouter-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run --detach \
            --name "$container" \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /run:rw,noexec,nosuid,size=16m \
            --publish 127.0.0.1:1212:1212 \
            --volume "$volume:/app/data" \
            suwokrouter:ci >/dev/null

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:1212/api/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi

          test "$(docker inspect --format '{{.Config.User}}' "$container")" = "bun"
            curl --fail --silent http://127.0.0.1:1212/login | grep --quiet "Suwok Router"
          curl --fail --silent http://127.0.0.1:1212/api/auth/status | grep --quiet '"defaultPasswordActive":true'
          docker exec "$container" sh -lc \
            'test -s /app/data/auth/jwt-secret && test -s /app/data/auth/api-key-secret && test -s /app/data/auth/machine-id-salt'
